[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo2fcstd"
version = "0.1.0"
description = "Photos of a physical part in, a parametric FreeCAD sketch model out"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python-headless",
    "pillow",
    "pillow-heif",
    "trimesh",
    "matplotlib",
    "torch",
    "torchvision",
    "transformers",
    "timm",
    "kornia",
    "einops",
]

[project.optional-dependencies]
dev = ["pytest", "scikit-learn", "joblib"]

[project.scripts]
photo2fcstd = "photo2fcstd.cli:run"
photo2fcstd-bench = "photo2fcstd.bench:run"
photo2fcstd-score = "photo2fcstd.score:run"
photo2fcstd-gallery = "photo2fcstd.gallery:run"
photo2fcstd-insight = "photo2fcstd.insight:run"
photo2fcstd-train-modes = "photo2fcstd.mode_model:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
