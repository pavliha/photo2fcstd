[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo2fcstd"
version = "0.1.0"
description = "Photos of a physical part in, a parametric FreeCAD sketch model out"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python-headless",
    "pillow",
    "pillow-heif",
    "trimesh",
    "matplotlib",
    "torch",
    "torchvision",
    "transformers",
    "timm",
    "scikit-image",
    "shapely",
    "kornia",
]

[project.optional-dependencies]
dev = ["pytest", "scikit-learn", "joblib"]

[project.scripts]
photo2fcstd = "photo2fcstd.cli:run"
photo2fcstd-bench = "photo2fcstd.bench:run"
photo2fcstd-score = "photo2fcstd.score:run"
photo2fcstd-gallery = "photo2fcstd.gallery:run"
photo2fcstd-report = "photo2fcstd.report:run"
photo2fcstd-embed = "photo2fcstd.embed:run"
photo2fcstd-insight = "photo2fcstd.insight:run"
photo2fcstd-carve = "photo2fcstd.carve_cli:run"
photo2fcstd-preflight = "photo2fcstd.preflight:run"
photo2fcstd-doctor = "photo2fcstd.doctor:run"
photo2fcstd-target = "photo2fcstd.make_target:run"
photo2fcstd-target-screen = "photo2fcstd.make_target:screen_run"
photo2fcstd-bop = "photo2fcstd.bop_cli:run"
photo2fcstd-train-modes = "photo2fcstd.mode_model:run"
photo2fcstd-train-views = "photo2fcstd.view_rank:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["build: needs a FreeCAD binary and the dataset"]
